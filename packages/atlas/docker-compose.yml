services:
  postgres:
    image: postgres:16-alpine
    container_name: nodegen-postgres
    environment:
      POSTGRES_DB: nodegen
      POSTGRES_USER: nodegen
      POSTGRES_PASSWORD: nodegen_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nodegen']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: nodegen-backend
    environment:
      DATABASE_URL: postgresql://nodegen:nodegen_dev_password@postgres:5432/nodegen
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    command: bun run dev

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: nodegen-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    command: bun run dev

volumes:
  postgres_data:
